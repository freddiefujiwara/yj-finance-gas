openapi: 3.0.0
info:
  title: Yahoo Finance JP Fetcher API
  description: A GAS Web App to fetch HTML content from Yahoo Finance JP.
  version: 1.0.0
servers:
  - url: https://script.google.com/macros/s/AKfycbx6iFGnB5EaSVedN5mk8F1L0iO9orwZZiOz_2m6wIRzHA1XsU555ib0Ex2LMCR1nLOvhw
    description: Production server
paths:
  /exec:
    get:
      summary: Fetch Yahoo Finance JP quote page content.
      parameters:
        - name: s
          in: query
          description: Ticker symbol.
          required: true
          schema:
            type: string
            example: "4755.T"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    nullable: true
                  content:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
